spring.application.name=FundFoundEasy
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

# ---------- PostgreSQL (env vars on Railway) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fundfoundeasy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:ChangeThisToAVeryLongSecretKeyAtLeast32BytesLongForHS256!!}
app.jwt.expiration-ms=86400000

# ---------- App base URL (email links) ----------
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ---------- Email (Mailtrap Sandbox) ----------
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@fundfounded.com}

# ---------- Auth behaviour ----------
app.auth.auto-verify=${AUTO_VERIFY:true}

# ---------- Cache (Redis dropped) ----------
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# ---------- Admin seed ----------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.email=${ADMIN_EMAIL:admin@fundfounded.com}

# ---------- File uploads ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.public-base-url=/uploads

# ---------- Logging ----------
logging.level.com.MLO.FundFoundEasy=INFO
logging.level.org.springframework.security=INFO
spring.jackson.serialization.write-dates-as-timestamps=false